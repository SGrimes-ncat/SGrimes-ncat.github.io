<BODY>
<SCRIPT language=JavaScript type=text/javascript>
	
	function validate_form(){
    	var message ="";
    		
    		message += checkAlphabet("Truck Name :", document.addform.truck_name.value);
    		message += checkPhone("Owner ID :", document.addform.owner_id.value);
    		message += checkAlphabet("Location : ", document.addform.location.value);
		message += checkLetter("Truck Name : ", document.addform.truck_name.value);
		message += checkPhone("Truck ID :", document.addform.truck_id.value);
    
    	if (message == ""){
      		return true;
    	} else {
      		alert(message);
      	return false;
    	}    
  	}

  

  	function checkAlphabet(field, itemcontent){
    	var nameregexp = /[a-zA-Z]+/;
    	if (!itemcontent.match(nameregexp)){
      		return field+" is required!\n";
    	}
    	return "";
  	}
	


	function checkPhone(field, itemcontent){
    	var phoneregexp = /[0-9]+/;
		
    	if ((field =="Owner ID") && (itemcontent=="")){
      		return field+" is required!\n";
		} else if ((itemcontent!="") && !itemcontent.match(phoneregexp)){
      		return field+" Numbers only!\n";
    	} else{
    		return "";
  		}
	}

	function checkLetter(field, itemcontent){
    	var letterregexp = /[a-zA-Z]+/;
		
    	if ((field =="Truck Name") && (itemcontent=="")){
      		return field+" is required!\n";
		} else if ((itemcontent!="") && !itemcontent.match(letterregexp)){
      		return field+" Letters Only!\n";
    	} else{
    		return "";
  		}
	}
</SCRIPT>

<p>&nbsp;</p>
